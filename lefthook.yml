pre-commit:
  parallel: false
  jobs:
    - name: biome check
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm run typecheck
    - name: build
      run: pnpm run build
